<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 高考志愿推荐系统</title>
  <link rel="stylesheet" href="{{ static_url('styles.css') }}" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon" style="width:48px;height:48px;font-size:1.2rem;margin:0 auto;">VRS</div>
    </div>
    <h1>高考志愿推荐系统</h1>
    <p class="login-subtitle">基于知识图谱的智能推荐平台</p>
    {% if error %}
    <div class="error-state mb-3">
      <span class="error-message">{{ error }}</span>
    </div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input class="form-input" type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary mt-3">进入系统</button>
    </form>
    <p class="text-center text-muted text-xs mt-3">当前为演示入口，填写非空用户名和密码即可进入。请勿使用真实账户密码。</p>
  </div>
</body>
</html>
