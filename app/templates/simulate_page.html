<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模拟沙箱 - 高考志愿推荐系统</title>
  <link rel="stylesheet" href="{{ static_url('styles.css') }}" />
</head>
<body class="page-simulate_page">
  {% include "_sidebar.html" %}

  <div class="app-main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:var(--space-3);">
        <button class="btn btn-ghost btn-sm mobile-nav-toggle" id="mobileNavToggle" title="菜单" aria-label="打开菜单"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <h1 class="page-title">What-If 模拟沙箱</h1>
      </div>
      <div class="topbar-actions">
        <span class="chip chip-accent">实验性</span>
      </div>
    </header>

    <main id="mainContent" tabindex="-1" class="content">
      <div class="content-grid">
        <!-- Left: Current Parameters -->
        <section class="card" aria-labelledby="currentParamsTitle">
          <div class="card-header">
            <div class="card-title-row">
              <div class="card-section-indicator"></div>
              <h2 class="card-title" id="currentParamsTitle">当前参数</h2>
            </div>
          </div>
          <p class="card-subtitle">来自控制台的基础信息设置</p>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label">位次</label>
              <span id="whatifOrigRank" class="box small">-</span>
            </div>
            <div class="form-group">
              <label class="form-label">分数</label>
              <span id="whatifOrigScore" class="box small">-</span>
            </div>
            <div class="form-group">
              <label class="form-label">选考科目</label>
              <span id="whatifOrigSubject" class="box small">-</span>
            </div>
            <div class="form-group">
              <label class="form-label">年份</label>
              <span id="whatifOrigYear" class="box small">-</span>
            </div>
          </div>
          <div class="form-group mt-3">
            <label class="form-label">专业倾向</label>
            <span id="whatifOrigMajors" class="box small">-</span>
          </div>
          <div class="form-group mt-3">
            <label class="form-label">地域倾向</label>
            <span id="whatifOrigProvinces" class="box small">-</span>
          </div>
        </section>

        <!-- Right: Simulation Controls -->
        <div style="display:flex;flex-direction:column;gap:var(--space-5);">
          <section class="card" aria-labelledby="simParamsTitle">
            <div class="card-header">
              <div class="card-title-row">
                <div class="card-section-indicator" style="background:#7C3AED;"></div>
                <h2 class="card-title" id="simParamsTitle">模拟参数</h2>
              </div>
              <span class="chip chip-accent">调整后运行对比</span>
            </div>
            <p class="card-subtitle">修改以下参数查看推荐结果的变化，帮助你评估不同策略的影响</p>
            <div class="form-grid-2">
              <div class="form-group">
                <label class="form-label" for="whatifNewRank">位次（调整）</label>
                <input class="form-input" id="whatifNewRank" type="number" min="1" />
              </div>
              <div class="form-group">
                <label class="form-label" for="whatifNewScore">分数（调整）</label>
                <input class="form-input" id="whatifNewScore" type="number" min="0" step="1" />
              </div>
            </div>
            <div class="form-group mt-3">
              <label class="form-label" for="whatifNewProvinces">地域倾向（调整，留空使用原值）</label>
              <input class="form-input" id="whatifNewProvinces" type="text" placeholder="北京, 上海" />
            </div>
            <div class="form-group mt-3">
              <label class="form-label" for="whatifNewMajors">专业倾向（调整，留空使用原值）</label>
              <input class="form-input" id="whatifNewMajors" type="text" placeholder="计算机科学与技术, 人工智能" />
            </div>
            <div class="btn-group mt-4">
              <button id="whatifRunBtn" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                运行模拟对比
              </button>
            </div>
            <div id="whatifResult" class="box small mt-3" style="display:none;max-height:450px;overflow-y:auto;"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div id="refreshNotice" class="refresh-notice hidden">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    数据已变动，建议刷新
    <button id="refreshBtn" class="btn btn-primary btn-sm">刷新</button>
  </div>

  <script src="{{ static_url('common.js') }}"></script>
  <script src="{{ static_url('simulate_page.js') }}"></script>
</body>
</html>
